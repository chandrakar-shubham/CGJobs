name: Fix dashboard banner visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-dashboard-banner.yml'

permissions:
  contents: write

jobs:
  fix-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply banner visibility fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('laravel-backend/resources/views/admin/dashboard.blade.php')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'bg-gradient-to-r from-brand-700 via-brand-600 to-indigo-700 rounded-3xl p-6 sm:p-8 text-white shadow-lg relative overflow-hidden': 'bg-blue-50 border border-blue-200 rounded-lg p-6 mb-6 shadow-md relative overflow-hidden',
              'bg-white/15 backdrop-blur-md rounded-full text-xs font-semibold uppercase tracking-wider text-saffron-300 mb-3': 'bg-blue-100 rounded-full text-xs font-semibold uppercase tracking-wider text-blue-600 mb-3',
              'text-2xl sm:text-3xl font-bold tracking-tight mb-2 text-white': 'text-2xl sm:text-3xl font-bold tracking-tight mb-2 text-gray-900',
              '<p class="text-white text-sm leading-relaxed">': '<p class="text-gray-600 text-sm leading-relaxed">',
              'bg-blue-700 hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-blue-700 text-white font-bold text-sm rounded-xl shadow-md transition': 'bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 text-white font-bold text-sm rounded-xl shadow-md transition',
              'bg-indigo-700 hover:bg-indigo-800 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-indigo-700 text-white font-bold text-sm rounded-xl shadow-md transition': 'bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 text-white font-bold text-sm rounded-xl shadow-md transition',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected dashboard fragment: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          grep -n "Welcome Banner\|bg-blue-50 border border-blue-200\|text-blue-600\|text-gray-900\|text-gray-600\|bg-blue-600\|bg-indigo-600" laravel-backend/resources/views/admin/dashboard.blade.php

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-dashboard-banner.yml
          git add laravel-backend/resources/views/admin/dashboard.blade.php .github/workflows/fix-dashboard-banner.yml
          git commit -m "fix: make admin dashboard welcome banner visible"
          git push origin main
