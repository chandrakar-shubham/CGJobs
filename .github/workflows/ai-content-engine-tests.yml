name: AI Content Engine Tests

on:
  pull_request:
    paths:
      - 'laravel-backend/**'
      - '.github/workflows/ai-content-engine-tests.yml'
  push:
    branches:
      - main
      - feature/ai-content-engine-v1
    paths:
      - 'laravel-backend/**'
      - '.github/workflows/ai-content-engine-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel-backend
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan test --testsuite=Feature --display-warnings --display-deprecations
