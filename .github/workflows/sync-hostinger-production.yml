name: Sync Hostinger Production Branch

on:
  push:
    branches:
      - main
    paths:
      - 'laravel-backend/**'
      - '.github/workflows/sync-hostinger-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Laravel-only production branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SPLIT_BRANCH="sync-hostinger-${GITHUB_RUN_ID}"
          git subtree split --prefix=laravel-backend -b "$SPLIT_BRANCH"
          git checkout "$SPLIT_BRANCH"

          # install.php is for first-time setup only. Normal production
          # deployments must never publish it again.
          if [ -f install.php ]; then
            git rm install.php
            git commit -m "Exclude first-install installer from production branch"
          fi

          # This marker exists only on the Hostinger production branch.
          # composer.json uses it to run deploy-hostinger.php after Hostinger
          # runs Composer, while local development remains unaffected.
          printf '%s\n' 'CGJobs Hostinger production deployment marker' > .hostinger-production
          git add .hostinger-production
          git commit -m "Mark Hostinger production deployment" 

          # Production branch is always a Laravel-only mirror of main.
          # Force-updating it is intentional; Hostinger deploys from this branch.
          git push --force origin "$SPLIT_BRANCH:hostinger-production"
          git checkout main
          git branch -D "$SPLIT_BRANCH"
