name: Update Laravel Composer Lock

on:
  push:
    paths:
      - 'laravel-backend/composer.json'
      - '.github/workflows/update-laravel-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, ctype, curl, dom, fileinfo, intl, openssl, pdo, pdo_mysql, tokenizer, xml
          coverage: none

      - name: Use clean Composer environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/composer-home"
          echo "COMPOSER_HOME=$RUNNER_TEMP/composer-home" >> "$GITHUB_ENV"

      - name: Verify PHP and Composer platform
        run: |
          php -v
          composer --version
          composer config platform.php
          composer show --platform | grep -E '^php[[:space:]]'

      - name: Resolve PHP 8.3 compatible dependencies
        run: composer update --no-dev --prefer-dist --no-interaction --no-progress --with-all-dependencies --no-scripts

      - name: Verify production install on PHP 8.3
        run: composer install --dry-run --no-dev --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Verify lock against real PHP 8.3 platform
        run: composer check-platform-reqs --lock --no-dev

      - name: Verify no PHP 8.4-only Symfony packages in production lock
        shell: bash
        run: |
          set -euo pipefail
          php -r '
          $lock = json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR);
          foreach ($lock["packages"] ?? [] as $package) {
              if (str_starts_with($package["name"] ?? "", "symfony/") && str_starts_with($package["version"] ?? "", "v8.")) {
                  fwrite(STDERR, "ERROR: Production lock contains Symfony 8 package: {$package["name"]} {$package["version"]}\n");
                  exit(1);
              }
          }
          echo "Verified: production packages contain no Symfony 8 releases.\n";
          '

      - name: Verify composer.lock exists
        run: test -s composer.lock

      - name: Commit composer.lock
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- laravel-backend/composer.lock)" ]; then
            echo "composer.lock is already current."
            exit 0
          fi
          git add laravel-backend/composer.lock
          git commit -m "Lock Laravel dependencies for PHP 8.3"
          git push origin main
